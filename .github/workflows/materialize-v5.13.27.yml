name: Materialize Colortina v5.13.27 source

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/materialize-v5.13.27.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  materialize:
    name: Publish audited v5.13.27 source and start release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild and verify final source archive
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/colortina-v51327.b64
          for part in 000 001 002 003 004 005; do
            cat ".github/v51327-payload/part-${part}.b64" >> /tmp/colortina-v51327.b64
          done
          tr -d '[:space:]' < /tmp/colortina-v51327.b64 > /tmp/colortina-v51327.clean.b64
          base64 --decode /tmp/colortina-v51327.clean.b64 > /tmp/colortina-v51327.tar.xz
          echo 'c2fa5d5d372d930d4269830deaf98667622fb238d2173a367b05d6a32c23db48  /tmp/colortina-v51327.tar.xz' | sha256sum -c -
          tar -tJf /tmp/colortina-v51327.tar.xz >/tmp/colortina-v51327-files.txt
          test -s /tmp/colortina-v51327-files.txt

      - name: Materialize real source
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/colortina-v51327.tar.xz -C .
          rm -rf source_sync source_sync_v2 source_sync_v3 source_sync_v4 _direct_payload .github/v51327-payload
          rm -f .github/workflows/materialize-v5.13.27.yml

      - name: Verify source README compilation and privacy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          cfg = Path('config.py').read_text(encoding='utf-8')
          m = re.search(r'^\s*APP_VERSION\s*=\s*["\x27]([^"\x27]+)["\x27]', cfg, re.M)
          assert m and m.group(1) == '5.13.27'
          readme = Path('README.md').read_text(encoding='utf-8')
          assert '## Colortina v5.13.27 更新（2026-08-10）' in readme
          PY
          python -m compileall -q core models ui vendor tools pipeline.py main.py config.py
          python scripts/privacy_audit.py
          git diff --check

      - name: Commit real source to main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Colortina v5.13.27 core source'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish source assets to v5.13.27 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA='${{ steps.source.outputs.sha }}'
          git archive --format=zip --output=/tmp/Colortina_5.13.27_Source.zip "$SHA"
          sha256sum /tmp/Colortina_5.13.27_Source.zip | sed 's#/tmp/##' >/tmp/Colortina_5.13.27_Source_SHA256.txt
          printf '%s\n' '## Colortina v5.13.27' '' 'Audited v5.13.27 source. Desktop assets are built from the same main revision.' >/tmp/release-notes.md
          if gh release view v5.13.27 >/dev/null 2>&1; then
            gh release edit v5.13.27 --title 'Colortina v5.13.27' --notes-file /tmp/release-notes.md --latest
          else
            gh release create v5.13.27 --target "$SHA" --title 'Colortina v5.13.27' --notes-file /tmp/release-notes.md --latest
          fi
          gh release upload v5.13.27 /tmp/Colortina_5.13.27_Source.zip /tmp/Colortina_5.13.27_Source_SHA256.txt --clobber
          gh release view v5.13.27 --json url,tagName,assets --jq '{url,tagName,assets:[.assets[].name]}'

      - name: Start multi-platform release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" -f ref=main
