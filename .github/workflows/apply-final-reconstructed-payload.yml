name: Apply final reconstructed Colortina payload

on:
  push:
    branches: [agent/colortina-payload-20260815b]
    paths:
      - '.github/workflows/apply-final-reconstructed-payload.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Reconstruct and verify exact audited payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, tarfile

          root = Path('.github/colortina_payload')
          target_archive_sha = '192edf5a704a2b83ef23bd03c3a8e5d0cad02a22aa2b3cb63a488a2fffac745c'
          target_b64_len = 322604

          def blob_sha(data: bytes) -> str:
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          def read(name: str) -> bytes:
              return (root / name).read_bytes()

          # Repair 208000:224000 by finding the unique 16k window with the audited Git blob SHA.
          damaged = read('repair_208_224.b64')
          expected_208 = '07659c7579d5fac287d1051d6584f88d96fa9491'
          matches = []
          for i in range(0, len(damaged) - 16000 + 1):
              candidate = damaged[i:i+16000]
              if blob_sha(candidate) == expected_208:
                  matches.append((i, candidate))
          if len(matches) != 1:
              raise SystemExit(f'208-224 repair window count={len(matches)}; refusing to continue')
          offset_208, fixed_208 = matches[0]
          print('recovered 208-224 at damaged-file offset', offset_208)

          # Repair the one missing character at the end of 224000:240000 by matching its audited blob SHA.
          short = read('repair_224_240.b64')
          if len(short) != 15999:
              raise SystemExit(f'unexpected 224-240 damaged size: {len(short)}')
          expected_224 = '737d4b1a7195c3d5a013647315f1824f45571bad'
          alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='
          candidates = [short + bytes([c]) for c in alphabet]
          good = [c for c in candidates if blob_sha(c) == expected_224]
          if len(good) != 1:
              raise SystemExit(f'224-240 one-char repair count={len(good)}; refusing to continue')
          fixed_224 = good[0]
          print('recovered final character for 224-240')

          pieces = []
          for i in range(8):
              pieces.append(read(f'part{i:02d}.b64'))
          pieces.append(read('part08.b64')[:12000])
          for i in range(9, 13):
              pieces.append(read(f'part{i:02d}.b64'))
          pieces.append(read('part13.b64'))
          pieces.append(read('repair_167784_168000.b64'))
          pieces.append(read('part14.b64'))
          pieces.append(read('repair_180_192.b64'))
          pieces.append(read('repair_192_208.b64'))
          pieces.append(fixed_208)
          pieces.append(fixed_224)
          for i in range(15, 18):
              pieces.append(read(f'part{i:02d}.b64'))
          pieces.append(read('part18.b64')[:20000])
          pieces.append(read('repair_308_end.b64'))

          payload_b64 = b''.join(pieces)
          if len(payload_b64) != target_b64_len:
              raise SystemExit(f'base64 length mismatch: {len(payload_b64)} != {target_b64_len}')
          try:
              archive = base64.b64decode(payload_b64, validate=True)
          except Exception as exc:
              raise SystemExit(f'base64 validation failed: {exc}')
          got = hashlib.sha256(archive).hexdigest()
          if got != target_archive_sha:
              raise SystemExit(f'archive SHA-256 mismatch: {got}')
          Path('/tmp/colortina-final.tar.xz').write_bytes(archive)

          allow = {
              x.strip() for x in '''Install_Mac27_MPS.command
          README.md
          build_update_package.command
          config.py
          main.py
          pipeline.py
          requirements-macos27.txt
          requirements.txt
          run_colortina.command
          update_colortina.command
          ui/canvas.py
          ui/i18n.py
          ui/main_window.py
          ui/worker.py
          core/ai_hair_parser.py
          core/anime_face_detector.py
          core/cancellation.py
          core/character_scope.py
          core/device_runtime.py
          core/edit_snapshot.py
          core/guided_colorist.py
          core/hair_model_manager.py
          core/hint_manager.py
          core/illustrative_inkwash.py
          core/image_compressor.py
          core/line_boundary.py
          core/local_model_recolor.py
          core/manual_edit.py
          core/mcv2_region_control.py
          core/mcv2_semantic_selection.py
          core/ml_colorizer.py
          core/model_downloader.py
          core/network_lockdown.py
          core/presets.py
          core/project_store.py
          core/selection_snap.py
          core/structural_line_detector.py
          core/style_post.py
          core/text_guard.py
          core/third_party/hair_parsing/__init__.py
          core/third_party/hair_parsing/anime_face_unet.py
          core/third_party/hair_parsing/bisenet19.py
          vendor/manga_colorization_v2/colorizator.py
          vendor/manga_colorization_v2/denoising/denoiser.py
          vendor/manga_colorization_v2/networks/models.py'''.splitlines() if x.strip()
          }
          with tarfile.open('/tmp/colortina-final.tar.xz', 'r:xz') as tf:
              names = [m.name for m in tf.getmembers() if m.isfile()]
              if len(names) != 45 or set(names) != allow:
                  raise SystemExit(f'archive member mismatch: count={len(names)}, missing={sorted(allow-set(names))}, extra={sorted(set(names)-allow)}')
          print('verified exact archive SHA-256', got, 'with', len(names), 'audited files')
          PY

      - name: Apply on top of current main and validate source tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          PARENT=$(git rev-parse origin/main)
          printf '%s\n' "$PARENT" > /tmp/main-parent.txt
          git reset --hard "$PARENT"
          git clean -fdx

          python - <<'PY'
          import pathlib, tarfile
          root = pathlib.Path.cwd().resolve()
          with tarfile.open('/tmp/colortina-final.tar.xz', 'r:xz') as tf:
              for m in tf.getmembers():
                  dest = (root / m.name).resolve()
                  if dest != root and root not in dest.parents:
                      raise SystemExit('unsafe tar path: ' + m.name)
                  if m.issym() or m.islnk():
                      raise SystemExit('links forbidden: ' + m.name)
              tf.extractall(root)
          PY

          chmod +x Install_Mac27_MPS.command build_update_package.command run_colortina.command update_colortina.command
          rm -f .github/workflows/apply-audited-colortina-sync.yml
          rm -f .github/workflows/build-audited-colortina-sync-branch.yml

          python scripts/privacy_audit.py
          python -m compileall -q main.py pipeline.py config.py core ui models vendor
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

          git add -A
          python - <<'PY'
          import subprocess
          allow = {
              x.strip() for x in '''Install_Mac27_MPS.command
          README.md
          build_update_package.command
          config.py
          main.py
          pipeline.py
          requirements-macos27.txt
          requirements.txt
          run_colortina.command
          update_colortina.command
          ui/canvas.py
          ui/i18n.py
          ui/main_window.py
          ui/worker.py
          core/ai_hair_parser.py
          core/anime_face_detector.py
          core/cancellation.py
          core/character_scope.py
          core/device_runtime.py
          core/edit_snapshot.py
          core/guided_colorist.py
          core/hair_model_manager.py
          core/hint_manager.py
          core/illustrative_inkwash.py
          core/image_compressor.py
          core/line_boundary.py
          core/local_model_recolor.py
          core/manual_edit.py
          core/mcv2_region_control.py
          core/mcv2_semantic_selection.py
          core/ml_colorizer.py
          core/model_downloader.py
          core/network_lockdown.py
          core/presets.py
          core/project_store.py
          core/selection_snap.py
          core/structural_line_detector.py
          core/style_post.py
          core/text_guard.py
          core/third_party/hair_parsing/__init__.py
          core/third_party/hair_parsing/anime_face_unet.py
          core/third_party/hair_parsing/bisenet19.py
          vendor/manga_colorization_v2/colorizator.py
          vendor/manga_colorization_v2/denoising/denoiser.py
          vendor/manga_colorization_v2/networks/models.py'''.splitlines() if x.strip()
          }
          permitted_deletes = {
              '.github/workflows/apply-audited-colortina-sync.yml',
              '.github/workflows/build-audited-colortina-sync-branch.yml',
          }
          rows = subprocess.check_output(['git','diff','--cached','--name-status'], text=True).splitlines()
          source_changes = []
          for row in rows:
              parts = row.split('\t')
              status, path = parts[0], parts[-1]
              if status.startswith('D'):
                  if path not in permitted_deletes:
                      raise SystemExit('unexpected deletion: ' + path)
                  continue
              if path not in allow:
                  raise SystemExit('path outside audited allowlist: ' + path)
              if path.startswith('Colortina.app/') or path == 'assets/icon.png' or '__pycache__/' in path or path.startswith('.env'):
                  raise SystemExit('forbidden staged path: ' + path)
              source_changes.append(path)
          if not source_changes:
              raise SystemExit('no audited source changes staged')
          print('validated staged source changes:', len(source_changes))
          print('staged paths:\n' + '\n'.join(rows))
          PY

      - name: Create one clean commit and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          PARENT=$(cat /tmp/main-parent.txt)
          git fetch origin main
          NOW=$(git rev-parse origin/main)
          if [ "$NOW" != "$PARENT" ]; then
            echo "main moved during validation: $PARENT -> $NOW" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          TREE=$(git write-tree)
          COMMIT=$(printf '%s\n\n%s\n' 'Sync audited Colortina core source' 'Incremental privacy-audited sync from the verified 45-file Colortina source package; repository-only files preserved and temporary sync workflows removed.' | git commit-tree "$TREE" -p "$PARENT")
          git push origin "$COMMIT":refs/heads/main
          echo "clean main commit: $COMMIT"
