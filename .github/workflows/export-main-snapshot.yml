name: Export main snapshot

on:
  push:
    branches: [main]
    paths: ['.github/workflows/export-main-snapshot.yml']

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove git metadata
        run: rm -rf .git
      - uses: actions/upload-artifact@v4
        with:
          name: colortina-main-snapshot
          path: .
          include-hidden-files: true
          retention-days: 1
