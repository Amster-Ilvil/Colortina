name: Apply audited Colortina source sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-audited-colortina-sync.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify audited payload
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 \
            'https://filebin.net/colortina-sync-20260815-final45/colortina.tar.xz' \
            -o /tmp/colortina.tar.xz
          curl -fsS --retry 5 --retry-delay 2 \
            'https://filebin.net/colortina-sync-20260815-final45/colortina.tar.xz.sha256' \
            -o /tmp/colortina.tar.xz.sha256
          cd /tmp
          sha256sum -c colortina.tar.xz.sha256

      - name: Apply only whitelisted source files
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/allowed.txt <<'EOF'
          README.md
          config.py
          main.py
          pipeline.py
          requirements.txt
          ui/canvas.py
          ui/i18n.py
          ui/main_window.py
          ui/worker.py
          core/anime_face_detector.py
          core/character_scope.py
          core/edit_snapshot.py
          core/guided_colorist.py
          core/hint_manager.py
          core/line_boundary.py
          core/local_model_recolor.py
          core/manual_edit.py
          core/ml_colorizer.py
          core/model_downloader.py
          core/network_lockdown.py
          core/presets.py
          core/project_store.py
          core/selection_snap.py
          core/structural_line_detector.py
          core/style_post.py
          core/text_guard.py
          vendor/manga_colorization_v2/colorizator.py
          vendor/manga_colorization_v2/denoising/denoiser.py
          vendor/manga_colorization_v2/networks/models.py
          Install_Mac27_MPS.command
          build_update_package.command
          requirements-macos27.txt
          run_colortina.command
          update_colortina.command
          core/ai_hair_parser.py
          core/cancellation.py
          core/device_runtime.py
          core/hair_model_manager.py
          core/illustrative_inkwash.py
          core/image_compressor.py
          core/mcv2_region_control.py
          core/mcv2_semantic_selection.py
          core/third_party/hair_parsing/__init__.py
          core/third_party/hair_parsing/anime_face_unet.py
          core/third_party/hair_parsing/bisenet19.py
          EOF

          python - <<'PY'
          import tarfile
          from pathlib import Path
          wanted = Path('/tmp/allowed.txt').read_text().splitlines()
          with tarfile.open('/tmp/colortina.tar.xz', 'r:xz') as tf:
              actual = [m.name for m in tf.getmembers() if m.isfile()]
          if actual != wanted:
              raise SystemExit(f'payload whitelist mismatch: {len(actual)} != {len(wanted)}')
          PY

          tar -xJf /tmp/colortina.tar.xz -C .
          chmod +x Install_Mac27_MPS.command build_update_package.command run_colortina.command update_colortina.command
          rm -f .github/workflows/apply-audited-colortina-sync.yml
          git add -A

          python scripts/privacy_audit.py
          python -m compileall -q main.py pipeline.py config.py core ui models vendor

          python - <<'PY'
          from pathlib import Path
          import subprocess
          allowed = set(Path('/tmp/allowed.txt').read_text().splitlines())
          allowed.add('.github/workflows/apply-audited-colortina-sync.yml')
          staged = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          unexpected = sorted(staged - allowed)
          if unexpected:
              raise SystemExit('unexpected staged paths: ' + ', '.join(unexpected))
          forbidden = [p for p in staged if any(x in p for x in ('Colortina.app','__pycache__','.github/colortina_payload','.env'))]
          if forbidden:
              raise SystemExit('forbidden staged paths: ' + ', '.join(forbidden))
          print(f'Validated staged paths: {len(staged)}')
          PY

      - name: Commit source sync to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync audited Colortina core source'
          git push origin HEAD:main
